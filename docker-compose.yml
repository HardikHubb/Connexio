version: "3.8"

# Stage 0: only Neo4j runs in Docker. Backend (uvicorn) and frontend (vite)
# run locally via the commands in README.md — this keeps the prototype
# simple and fast to iterate on, per the "no unnecessary infra" principle.

services:
  neo4j:
    image: neo4j:5-community
    container_name: sih26189-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (used by the backend driver)
    environment:
      - NEO4J_AUTH=neo4j/testpassword123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
